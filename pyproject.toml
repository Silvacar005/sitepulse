[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "sitepulse"
version = "1.0.0"
description = "A full-stack website quality scanner for SEO, accessibility, structure, performance, and link health."
authors = [{ name = "Carlos Silva" }]
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "beautifulsoup4>=4.12,<5",
    "requests>=2.32,<3",
    "fastapi>=0.115,<1",
    "uvicorn>=0.30,<1",
    "httpx>=0.27,<1",
    "sqlalchemy>=2.0,<3",
    "psycopg[binary]>=3.2,<4",
]

[project.scripts]
sitepulse = "sitepulse.cli:main"

[tool.setuptools.package-data]
sitepulse = ["static/*"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
