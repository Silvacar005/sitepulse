services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: sitepulse
      POSTGRES_USER: sitepulse
      POSTGRES_PASSWORD: sitepulse
    volumes:
      - sitepulse_postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U sitepulse -d sitepulse"]
      interval: 5s
      timeout: 5s
      retries: 10

  web:
    build: .
    ports:
      - "8000:8000"
    environment:
      SITEPULSE_DATABASE_URL: postgresql://sitepulse:sitepulse@db:5432/sitepulse
    depends_on:
      db:
        condition: service_healthy

volumes:
  sitepulse_postgres:
